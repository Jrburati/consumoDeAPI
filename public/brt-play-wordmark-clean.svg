<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 0 998 260">
  <defs>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2BD6"/>
      <stop offset="55%" stop-color="#B119FF"/>
      <stop offset="100%" stop-color="#8818FA"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(30,25) skewX(-10)">
    <rect x="0" y="10" width="10" height="180" rx="5" fill="#FF2BD6" filter="url(#softGlow)"/>
    <text x="55" y="150" font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-size="145" font-weight="900" letter-spacing="-8" fill="#F7F7FF">BRT</text>
    <text x="350" y="150" font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-size="145" font-weight="900" letter-spacing="-8" fill="url(#playGrad)">Play</text>
  </g>
</svg>
